[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-move-check"
version = "0.1.0"
description = "Offline RSS podcast migration identity and episode continuity checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = ["defusedxml==0.7.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
podcast-move-check = "podcast_move_check.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/podcast-move-check"
Issues = "https://github.com/KanadeK/podcast-move-check/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
